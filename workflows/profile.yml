name: Update GitHub Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  update-profile:
    name: Generate profile assets

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # CREATE REQUIRED DIRECTORIES
      # ==================================================

      - name: Prepare directories
        run: |
          mkdir -p profile
          mkdir -p dist


      # ==================================================
      # GITHUB PROFILE SUMMARY
      # ==================================================

      - name: Generate GitHub summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release

        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

        with:
          USERNAME: pemvdev

          BRANCH_NAME: main

          UTC_OFFSET: -3

          AUTO_PUSH: false

          THEME: github_dark

          ANIMATION: load

          DURATION: 3

          NAME: "Pedro Valim"


      # ==================================================
      # CONTRIBUTION STREAK
      # ==================================================

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@main

        with:
          options: >
            user=pemvdev
            &theme=tokyonight
            &hide_border=true
            &background=0D1117
            &timezone=America/Sao_Paulo

          path: profile/streak.svg

          token: ${{ secrets.GITHUB_TOKEN }}


      # ==================================================
      # CONTRIBUTION SNAKE
      # ==================================================

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3

        with:
          github_user_name: pemvdev

          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark


      # ==================================================
      # COMMIT EVERYTHING
      # ==================================================

      - name: Commit generated profile assets
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output/
          git add profile/
          git add dist/

          git diff --cached --quiet && exit 0

          git commit -m "chore: update profile assets"

          git push
